# Integration tests run against their OWN database so they never touch dev data.
# Default: a throwaway PostgreSQL 16 started by Testcontainers (needs Docker), migrated from empty by Flyway.
# Or point TEST_DB_URL at a local database whose name contains "test" (testsupport.LocalDatabaseOnlyGuard refuses
# anything else), e.g. jdbc:postgresql://localhost:5432/booking_test after CREATE DATABASE booking_test OWNER booking;
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///booking_test}
    username: ${TEST_DB_USER:booking}
    password: ${TEST_DB_PASSWORD:booking}
    # Spring keeps every distinct test context alive (about a dozen with the audit tests), each with its own pool.
    # Ten connections each ran PostgreSQL out of slots ("too many clients already"); six each stays well under 100.
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
  flyway:
    locations: classpath:db/migration,classpath:db/testfix
app:
  auth:
    code-secret: test-only-code-secret-test-only-code-secret-1234
  # MockMvc requests all come from 127.0.0.1: per-IP limits are lifted unless a test sets its own remote address.
  # Per-account limits, failed logins, feed misses, unsubscribe and forgot-password per IP keep their real values.
  rate-limit:
    auth-per-ip: {max: 100000, window: 1h}
    register-per-ip: {max: 100000, window: 1h}
    resend-per-ip: {max: 100000, window: 1h}
  jwt:
    secret: test-only-secret-test-only-secret-test-only-1234
    # Same values the tests used to need as env vars; timeouts only, not secrets
    idle-timeout-ms: 1800000
    absolute-timeout-ms: 86400000
    renew-threshold-ratio: 0.5
