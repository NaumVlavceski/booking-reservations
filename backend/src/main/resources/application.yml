server:
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  flyway:
    enabled: true
  management:
    endpoint:
      health:
        show-details: always
    health:
      db:
        enabled: true
app:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  auth:
    code-secret: ${EMAIL_CODE_SECRET:}
    code-ttl-minutes: 15
    code-max-attempts: 5
    resend-cooldown-seconds: 60
    codes-per-hour: 5
    ip-limit-per-hour: ${AUTH_IP_LIMIT_PER_HOUR:30}
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 86400000
  mail:
    enabled: ${MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:RoomTrack <onboarding@resend.dev>}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
