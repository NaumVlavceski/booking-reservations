server:
  forward-headers-strategy: native
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    enabled: true
  jpa:
    show-sql: false
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
app:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  auth:
    code-secret: ${EMAIL_CODE_SECRET:}
    code-ttl-minutes: 15
    code-max-attempts: 5
    resend-cooldown-seconds: 60
    codes-per-hour: 5
    reset-code-ttl-minutes: 10
    reset-token-ttl-minutes: 10
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  rate-limit:
    max-keys: ${RATE_LIMIT_MAX_KEYS:50000}
    auth-per-ip:
      max: ${AUTH_IP_LIMIT_PER_HOUR:30}
      window: 1h
    login-failures-per-account:
      max: 5
      window: 15m
    login-failures-per-ip:
      max: 20
      window: 15m
    register-per-ip:
      max: 5
      window: 1h
    register-per-email:
      max: 5
      window: 1h
    resend-per-ip:
      max: 5
      window: 1h
    resend-per-email:
      max: 5
      window: 1h
    forgot-per-ip:
      max: ${AUTH_RESET_IP_LIMIT_PER_HOUR:5}
      window: 1h
    change-password:
      max: 5
      window: 15m
    account-deletion:
      max: 5
      window: 15m
    data-export:
      max: 5
      window: 1h
    feed-per-token:
      max: 120
      window: 1h
    feed-misses-per-ip:
      max: 30
      window: 1h
    unsubscribe-per-ip:
      max: 30
      window: 1h
  jwt:
    secret: ${APP_JWT_SECRET:}
    idle-timeout-ms: ${APP_JWT_IDLE_TIMEOUT_MS}
    absolute-timeout-ms: ${APP_JWT_ABSOLUTE_TIMEOUT_MS}
    renew-threshold-ratio: ${APP_JWT_RENEW_THRESHOLD_RATIO}
  mail:
    enabled: ${MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:RoomTrack <onboarding@resend.dev>}
    log-retention-days: ${EMAIL_LOG_RETENTION_DAYS:90}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
