spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  flyway:
    enabled: true
  management:
    endpoint:
      health:
        show-details: always
    health:
      db:
        enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 86400000
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
