server:
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  flyway:
    enabled: true
  management:
    endpoint:
      health:
        show-details: always
    health:
      db:
        enabled: true
app:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  auth:
    code-secret: ${EMAIL_CODE_SECRET:}
    code-ttl-minutes: 15
    code-max-attempts: 5
    resend-cooldown-seconds: 60
    codes-per-hour: 5
    ip-limit-per-hour: ${AUTH_IP_LIMIT_PER_HOUR:30}
    # Forgot password (reuses code-secret, code-max-attempts, resend-cooldown-seconds and codes-per-hour)
    reset-code-ttl-minutes: 10
    reset-token-ttl-minutes: 10
    reset-ip-limit-per-hour: ${AUTH_RESET_IP_LIMIT_PER_HOUR:5}
  jwt:
    secret: ${APP_JWT_SECRET:}
    idle-timeout-ms: ${APP_JWT_IDLE_TIMEOUT_MS}
    absolute-timeout-ms: ${APP_JWT_ABSOLUTE_TIMEOUT_MS}
    renew-threshold-ratio: ${APP_JWT_RENEW_THRESHOLD_RATIO}
  mail:
    enabled: ${MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:RoomTrack <onboarding@resend.dev>}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
