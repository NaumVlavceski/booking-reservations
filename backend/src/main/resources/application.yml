server:
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/calendar,text/html,text/plain
    min-response-size: 2KB
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/fresh-install
    ignore-migration-patterns: "*:future,*:ignored"
  task:
    scheduling:
      pool:
        # A slow calendar download must not hold up the cleanup jobs
        size: 3
  jpa:
    show-sql: false
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
app:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  auth:
    code-secret: ${EMAIL_CODE_SECRET:}
    code-ttl-minutes: 15
    code-max-attempts: 5
    resend-cooldown-seconds: 60
    codes-per-hour: 5
    reset-code-ttl-minutes: 10
    reset-token-ttl-minutes: 10
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://roomtrack.app,https://www.roomtrack.app}
  rate-limit:
    max-keys: ${RATE_LIMIT_MAX_KEYS:50000}
    auth-per-ip:
      max: ${AUTH_IP_LIMIT_PER_HOUR:30}
      window: 1h
    login-failures-per-account:
      max: 5
      window: 15m
    login-failures-per-ip:
      max: 20
      window: 15m
    register-per-ip:
      max: 5
      window: 1h
    register-per-email:
      max: 5
      window: 1h
    resend-per-ip:
      max: 5
      window: 1h
    resend-per-email:
      max: 5
      window: 1h
    forgot-per-ip:
      max: ${AUTH_RESET_IP_LIMIT_PER_HOUR:5}
      window: 1h
    change-password:
      max: 5
      window: 15m
    account-deletion:
      max: 5
      window: 15m
    data-export:
      max: 5
      window: 1h
    feed-per-token:
      max: 120
      window: 1h
    feed-misses-per-ip:
      max: 30
      window: 1h
    unsubscribe-per-ip:
      max: 30
      window: 1h
    # Swagger UI and the spec (only reachable when app.docs.enabled); one page load is about ten requests
    docs-per-ip:
      max: 300
      window: 1h
    demo-per-ip:
      max: 10
      window: 1h
    # The contact form (POST /api/contact). contact-total caps all visitors together, so a flood from many
    # addresses can't fill the inbox or use up the Resend quota that the sign-up codes also need.
    contact-per-ip:
      max: 5
      window: 1h
    contact-total:
      max: 30
      window: 1h
    # Resend delivery reports (signed, see ResendWebhookController). Resend sends from a few addresses.
    webhook-per-ip:
      max: 1000
      window: 1h
    # Admin panel: Send email (per admin session) and Delete owner (per admin)
    admin-mail-per-session:
      max: 20
      window: 1h
    admin-delete-per-admin:
      max: 5
      window: 1h
  jwt:
    secret: ${APP_JWT_SECRET:}
    idle-timeout-ms: ${APP_JWT_IDLE_TIMEOUT_MS}
    absolute-timeout-ms: ${APP_JWT_ABSOLUTE_TIMEOUT_MS}
    renew-threshold-ratio: ${APP_JWT_RENEW_THRESHOLD_RATIO}
  mail:
    enabled: ${MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:RoomTrack <onboarding@resend.dev>}
    log-retention-days: ${APP_EMAIL_LOG_RETENTION_DAYS:${EMAIL_LOG_RETENTION_DAYS:90}}
    # Resend webhook signing secret (whsec_...). Empty: POST /api/webhooks/resend answers 404.
    resend-webhook-secret: ${RESEND_WEBHOOK_SECRET:}
  # The contact form sends each message to this address (Reply-To is the visitor's). Kept on the server only, never
  # in the code or the website. Empty: the form answers 503 CONTACT_UNAVAILABLE.
  contact:
    to: ${CONTACT_TO:}
  # Public API documentation. Off unless APP_DOCS_ENABLED=true; server-url is the address "Try it out" calls
  # (empty: worked out from the request, which behind Caddy is already https://api.roomtrack.app).
  docs:
    enabled: ${APP_DOCS_ENABLED:false}
    server-url: ${APP_DOCS_SERVER_URL:}
  # "Try the demo" (POST /api/auth/demo, see DemoAccounts). On by default; docker-compose.yml passes
  # APP_DEMO_ENABLED and turns it off there unless .env says true. Each visitor gets a
  # private copy of the sample data, deleted after `lifetime`; at most `max-active` demos exist at once.
  # Admin panel (ADMIN_PANEL_CHANGES.md)
  admin:
    # Off unless APP_ADMIN_ENABLED=true; then the app refuses to start without working email (AdminStartupCheck)
    enabled: ${APP_ADMIN_ENABLED:false}
    # The admin session window (Continue adds another) and the absolute cap from the email code
    session-minutes: ${APP_ADMIN_SESSION_MINUTES:30}
    session-max-hours: ${APP_ADMIN_SESSION_MAX_HOURS:8}
    # Optional read-only mount with the database backups; empty or unreadable: "unknown" in System status
    backup-dir: ${APP_ADMIN_BACKUP_DIR:}
    # Whose free space System status shows
    disk-path: ${APP_ADMIN_DISK_PATH:/}
    # Send email: the sender (a domain verified in Resend) and where replies go. Empty sender: Send email is off.
    mail-from: ${APP_ADMIN_MAIL_FROM:}
    mail-reply-to: ${APP_ADMIN_MAIL_REPLY_TO:}
    # admin_audit_log rows older than this are deleted once a day (AdminAuditRetentionScheduler)
    audit-retention-days: ${APP_AUDIT_RETENTION_DAYS:730}
    # "Needs help" thresholds (AttentionRules)
    attention:
      unverified-hours: 24
      sync-failures: 2
      sync-stale-hours: 48
      stuck-days: 3
      email-problem-days: 30
      inactive-days: 14
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
    lifetime: 1h
    max-active: 300
springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}
    # The token typed into "Authorize" is not kept in the browser after the page closes
    persist-authorization: false
    display-request-duration: true
    default-models-expand-depth: 0
  default-produces-media-type: application/json
