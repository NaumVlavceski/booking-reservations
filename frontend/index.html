<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser bars match the app's top bar in each theme (tokens.css: --rt-surface). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111A27" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RoomTrack: one calendar for every booking from Booking.com, Airbnb and your own guests." />
    <title>RoomTrack</title>
  </head>
  <body>
    <!-- Calendar bar textures (see CalendarPage.css): Airbnb dots, blocked hatching. Colours come from the theme tokens. -->
    <svg aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <pattern id="rt-tex-airbnb" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" style="fill: var(--rt-src-airbnb-fill)" />
          <circle cx="3" cy="3" r="1.1" style="fill: var(--rt-src-airbnb-texture)" />
        </pattern>
        <pattern id="rt-tex-blocked" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" style="fill: var(--rt-src-blocked-fill)" />
          <rect width="2" height="6" style="fill: var(--rt-src-blocked-texture)" />
        </pattern>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
